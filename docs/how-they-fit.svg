<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 312" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .mask, .box, .accent { fill: #ffffff; }
    .box { stroke: #1f2328; }
    .accent { stroke: #3b5bdb; stroke-width: 1.5; }
    .zone { fill: none; stroke: #59636e; stroke-dasharray: 5 4; }
    .name { fill: #1f2328; font-size: 13px; }
    .name, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sub { fill: #59636e; }
    .wire { fill: none; stroke: #59636e; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1d1d1a; stroke: #34332e; }
      .mask, .box, .accent { fill: #1d1d1a; }
      .box { stroke: #ecebe4; }
      .accent { stroke: #7d9cff; }
      .zone, .wire { stroke: #a3a299; }
      .name { fill: #ecebe4; }
      .sub, .head { fill: #a3a299; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="311" rx="10"/>

  <!-- zone -->
  <rect class="zone" x="212" y="28" width="420" height="264" rx="8"/>
  <rect class="mask" x="220" y="20" width="354" height="16"/>
  <text x="228" y="32" class="sub"><tspan class="mono">team-protocol</tspan> · shared rules: dispatch, counting, handoff</text>

  <!-- arrows: kickoff → scan, scan → council, scan → refactor -->
  <path class="wire" d="M244 82 H107 Q99 82 99 90 V128"/>
  <path class="head" d="M94 128 L99 136 L104 128 Z"/>
  <path class="wire" d="M174 162 H236"/>
  <path class="head" d="M236 157 L244 162 L236 167 Z"/>
  <path class="wire" d="M99 188 V242 Q99 250 107 250 H236"/>
  <path class="head" d="M236 245 L244 250 L236 255 Z"/>
  <!-- kickoff → council, council → plan -->
  <path class="wire" d="M324 108 V128"/>
  <path class="head" d="M319 128 L324 136 L329 128 Z"/>
  <path class="wire" d="M404 162 H436"/>
  <path class="head" d="M436 157 L444 162 L436 167 Z"/>
  <!-- every gate → team-ceo-view -->
  <path class="wire" d="M404 82 H672"/>
  <path class="head" d="M672 77 L680 82 L672 87 Z"/>
  <path class="wire" d="M384 136 V130 Q384 122 392 122 H672"/>
  <path class="head" d="M672 117 L680 122 L672 127 Z"/>
  <path class="wire" d="M604 162 H672"/>
  <path class="head" d="M672 157 L680 162 L672 167 Z"/>
  <path class="wire" d="M404 250 H672"/>
  <path class="head" d="M672 245 L680 250 L672 255 Z"/>

  <!-- boxes -->
  <rect class="box" x="24" y="136" width="150" height="52" rx="6"/>
  <text class="name" x="99" y="158" text-anchor="middle">team-scan</text>
  <text class="sub" x="99" y="176" text-anchor="middle">project profile</text>

  <rect class="box" x="244" y="56" width="160" height="52" rx="6"/>
  <text class="name" x="324" y="78" text-anchor="middle">team-kickoff</text>
  <text class="sub" x="324" y="96" text-anchor="middle">new project</text>

  <rect class="box" x="244" y="136" width="160" height="52" rx="6"/>
  <text class="name" x="324" y="158" text-anchor="middle">team-council</text>
  <text class="sub" x="324" y="176" text-anchor="middle">debate → decision</text>

  <rect class="box" x="444" y="136" width="160" height="52" rx="6"/>
  <text class="name" x="524" y="158" text-anchor="middle">team-council-plan</text>
  <text class="sub" x="524" y="176" text-anchor="middle">decision → plan</text>

  <rect class="box" x="244" y="224" width="160" height="52" rx="6"/>
  <text class="name" x="324" y="246" text-anchor="middle">team-refactor</text>
  <text class="sub" x="324" y="264" text-anchor="middle">panel → backlog</text>

  <rect class="accent" x="680" y="56" width="156" height="220" rx="6"/>
  <text class="name" x="758" y="152" text-anchor="middle">team-ceo-view</text>
  <text class="sub" x="758" y="172" text-anchor="middle">CEO gate:</text>
  <text class="sub" x="758" y="188" text-anchor="middle">you decide</text>
</svg>

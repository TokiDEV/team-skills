<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Gate</title>
<style>
:root {
  color-scheme: dark;
  --bg: #141412; --surface: #1d1d1a; --surface-2: #262622; --ink: #ecebe4; --ink-2: #a3a299;
  --line: #34332e; --accent: #7d9cff; --accent-ink: #0d1330;
  --ok: #5fd39a; --ok-bg: #173226; --no: #ff8a7d; --no-bg: #3a1c18; --warn: #f0c050; --warn-bg: #3a2f12;
  --pro: #9db6ff; --pro-bg: #1b2440; --con: #f3b660; --con-bg: #36270f;
  --code-bg: #232320; --del: #3a1f1c; --add: #1b3324;
  --radius: 10px; --side-w: 300px; --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 36px 0 12px; font-weight: 600; }
h3 { font-size: 16px; margin: 0; }
[hidden] { display: none !important; }

/* Layout: sticky sidebar on the left, header and cards on the right */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-areas: "side head" "side main"; align-items: start; }
#head { grid-area: head; padding: 32px 32px 0; max-width: 920px; }
#app { grid-area: main; padding: 0 32px 60px; max-width: 920px; }
#side { grid-area: side; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--line); }
.side-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 12px; }
.side-foot { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--surface); }

/* Header */
.meta { color: var(--ink-2); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.meta code { font-family: var(--mono); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.summary { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); padding: 14px 18px; margin-top: 20px; }
.summary ul { margin: 0; padding-left: 18px; }
.summary > ul > li + li { margin-top: 6px; }
.summary li ul { margin-top: 2px; }
.summary > ul > li { break-inside: avoid; }
.summary .slabel { font-weight: 650; }

/* Sidebar: search, filters, overview */
.side-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 6px; }
.side-title:first-child { margin-top: 0; }
#side input[type=search] { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#side select { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-top: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.pill { font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); cursor: pointer; }
.pill:hover { border-color: var(--accent); color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#side input:focus-visible, #side select:focus-visible, .pill:focus-visible, .gname:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.shown-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.link { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.group { padding: 8px 0; border-top: 1px solid var(--line); }
.group:first-of-type { border-top: 0; }
.gname { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; }
.gname:hover span:first-child { color: var(--accent); }
.gname[aria-pressed="true"] span:first-child { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.gname .count { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.gtrack { height: 3px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 5px 0 6px; }
.gfill { height: 100%; background: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { font: 11px/1.2 var(--mono); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg);
  color: var(--ink-2); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.done { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.neg { background: var(--no-bg); color: var(--no); border-color: transparent; }
.chip.dim { opacity: .35; }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.progress .txt { font-size: 13px; color: var(--ink-2); }
.progress .track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 4px 0 10px; }
.progress .fill { height: 100%; width: 100%; background: var(--ok); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
.actions { display: grid; grid-template-columns: auto 1fr; gap: 6px; }
.btn { font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 8px; padding: 8px 10px; cursor: pointer; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); grid-column: 1 / -1; }
.btn.wide { grid-column: 1 / -1; }
/* Reset / Accept recommended edit the page; the buttons below them send it somewhere: keep the two groups apart */
#reset, #recAll { margin-bottom: 14px; }
.btn[hidden] { display: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: none; width: 100%; font: 12px/1.5 var(--mono); height: 140px; margin-top: 8px; padding: 8px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.toast { font-size: 12.5px; color: var(--ok); font-weight: 600; margin-top: 6px; min-height: 1em; }
/* No message yet: no reserved line under the buttons */
.toast:empty { margin-top: 0; min-height: 0; }
/* Keyboard: the current card, its chip, and option number hints */
.card.card.current { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent), 0 0 0 1px var(--accent); }
.chip.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.opt .k { display: none; font: 11px/1 var(--mono); padding: 2px 5px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.card.current .opt .k { display: inline-block; }
.opt[aria-pressed="true"] .k { background: color-mix(in srgb, var(--accent-ink) 20%, transparent); color: inherit; }
.kbd-hint { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
kbd { font: 11px/1 var(--mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
dialog.help { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 18px 22px; max-width: 420px; }
dialog.help::backdrop { background: rgb(0 0 0 / .6); }
dialog.help h3 { margin-bottom: 10px; }
.share-picker { max-width: 480px; }
.share-q { border: 0; padding: 0; margin: 0 0 12px; }
.share-q legend { font-size: 12.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.chan { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.chan.off { opacity: .55; cursor: default; }
.chan small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.chan-to { display: flex; gap: 10px; align-items: center; margin: 4px 0 12px; }
.chan-to input { flex: 1; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.share-picker .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
dialog.help table { border-collapse: collapse; font-size: 14px; }
dialog.help td { padding: 4px 12px 4px 0; vertical-align: top; }
dialog.help td:first-child { white-space: nowrap; }
/* Sidebar toggle. Closed: the sidebar folds away and its footer becomes a bottom bar. */
.side-top { display: flex; justify-content: space-between; align-items: center; }
.side-top .side-title { margin: 0; }
.icon-btn { font: inherit; font-size: 14px; line-height: 1; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--accent); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.side-open { position: fixed; top: 14px; left: 14px; z-index: 7; }
.side-closed .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "main"; }
.side-closed #head, .side-closed #app { padding-left: 64px; }
.side-closed .side-scroll { display: none; }
.side-closed #side { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; z-index: 6; border: 0; margin: 0; border-radius: 0; background: none; }
.side-closed .side-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); position: static; }
.side-closed .progress { flex: 1; min-width: 160px; }
.side-closed .progress .track { margin-bottom: 0; }
.side-closed .actions { display: flex; }
.side-closed #reset, .side-closed #recAll { margin-bottom: 0; }
.side-closed #recAll { margin-right: 14px; }
.side-closed .toast { margin: 0; }
.side-closed #app { padding-bottom: 120px; }
.empty { color: var(--ink-2); text-align: center; padding: 40px 0; display: none; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
  transition: border-color .15s, box-shadow .15s; scroll-margin-top: 16px; }
.card[data-state="decided"] { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.card.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.card-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card-id { font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--surface-2); padding: 1px 7px; border-radius: 6px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.kind { text-transform: uppercase; letter-spacing: .06em; font-weight: 700; font-size: 10px; }
.detail { color: var(--ink); margin-top: 8px; }
.why { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.rel { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.rel > div + div { margin-top: 2px; }
.rel a { color: var(--accent); font-weight: 600; text-decoration: none; }
.rel a:hover { text-decoration: underline; }
.rel-gap { display: block; color: var(--warn); margin-top: 2px; }
.rel-gap:empty { display: none; }
.chip.gap { box-shadow: inset 0 0 0 2px var(--warn); }
.detail p, .why p { margin: 0; }
.detail ul, .why ul { margin: 2px 0 0; padding-left: 18px; }
.detail code, .why code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 0 4px; border-radius: 4px; }
.detail strong, .why strong { font-weight: 650; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mchip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.mchip b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.mchip.good b { color: var(--ok); } .mchip.bad b { color: var(--no); }
/* Arguments use blue/amber so they never read as the red/green code diff */
.args { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.args > div { border-radius: 8px; padding: 10px 12px; min-width: 0; border-left: 3px solid; }
.args .pro { background: var(--pro-bg); border-color: var(--pro); } .args .con { background: var(--con-bg); border-color: var(--con); }
.args .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 4px; }
.args .pro .lbl { color: var(--pro); } .args .con .lbl { color: var(--con); }
.args ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.args li + li { margin-top: 4px; }
.args .who { font-weight: 650; }
.args .none { font-size: 13px; color: var(--ink-2); font-style: italic; }
/* The bridge: what binds the decision and what each option gains and costs per lens. Above the arguments, outside the tabs */
.bridge { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); font-size: 13.5px; }
.bridge .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.bridge .klist + .lbl { margin-top: 14px; }
.klist { list-style: none; margin: 0; padding: 0; }
.summary .klist { padding-left: 0; }
.klist li + li { margin-top: 4px; }
.klist code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 0 4px; border-radius: 4px; }
.klens { font-size: 12px; font-weight: 650; color: var(--ink-2); margin-right: 6px; white-space: nowrap; }
.klens .licon { width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; }
.kid { font: 11px/1.2 var(--mono); padding: 1px 5px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); margin-left: 6px; }
.kstat { font-size: 11px; color: var(--warn); margin-left: 6px; }
.ksrc { font-size: 12px; color: var(--ink-2); margin-left: 6px; }
.btable { width: 100%; border-collapse: collapse; }
.btable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 700; padding: 0 10px 6px 0; }
.btable td { padding: 6px 10px 6px 0; vertical-align: top; border-top: 1px solid var(--line); }
.btable th:first-child, .btable td:first-child { padding-left: 8px; }
.btable td:first-child { font-weight: 600; }
.btable tr.pick td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.btable tr.pick td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.btable .rec { display: block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-top: 1px; }
/* Breaking a constraint: the option stays choosable and says what choosing it costs */
.lift { font: 600 11px/1.3 var(--mono); padding: 1px 6px; border-radius: 5px; white-space: nowrap;
  color: var(--no); background: var(--no-bg); border: 1px solid color-mix(in srgb, var(--no) 40%, transparent); }
.btable .lift { display: block; width: fit-content; margin-top: 4px; }
.bridge .accepts { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.bridge .accepts b { color: var(--ink-2); font-weight: 650; }
.head-constraints { margin-top: 12px; }
/* Lenses: the header names what a card concerns; a card with both switches its arguments by tab. The bridge never hides */
.licon { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lens-chips { display: inline-flex; gap: 4px; margin-left: auto; align-self: center; }
.tag.lens { display: inline-flex; align-items: center; gap: 4px; font-weight: 650; color: var(--ink); background: none; border: 1px solid var(--line); padding: 1px 7px 1px 6px; }
.pill .licon { width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; }
.lens-tabs { display: flex; gap: 20px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.ltab { font: inherit; font-size: 13px; font-weight: 650; padding: 6px 2px 7px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent;
  background: none; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: color .15s ease-out, border-color .15s ease-out; }
.ltab .n { font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); text-align: center; }
.ltab:hover { color: var(--ink); }
.ltab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ltab[aria-pressed="true"] .n { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }
.ltab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 640px) {
  /* The trade-off table stacks: one block per option, each cost labelled by its lens */
  .btable, .btable tbody, .btable tr, .btable td { display: block; }
  .btable tr:first-child { display: none; }
  .btable tr { border-top: 1px solid var(--line); padding: 6px 0; }
  .btable td { border-top: 0; padding: 2px 8px; }
  .btable td[data-l]::before { content: attr(data-l); display: block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .lens-chips { margin-left: 0; }
}
.lens-none { font-size: 13px; color: var(--ink-2); font-style: italic; margin-top: 8px; }
.card[data-lens="business"] [data-lens="tech"], .card[data-lens="tech"] [data-lens="business"] { display: none; }
.tension { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg); }
.side .who { font-weight: 650; font-size: 13px; margin-bottom: 4px; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.diff > div { min-width: 0; }
.diff .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-bottom: 4px; }
pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--code-bg); font: 12.5px/1.5 var(--mono);
  overflow-x: auto; white-space: pre; }
pre.before { background: var(--del); } pre.after { background: var(--add); }
.figure { margin: 12px 0 0; }
/* Outcome: where the work lands, today beside the target */
.outcome { margin-top: 20px; }
.outcome .oview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-top: 10px; }
.outcome .ohead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.outcome .ohead b { font-size: 14px; }
.outcome .opanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(640px, 100%), 1fr)); gap: 12px; margin-top: 6px; }
.outcome .opane { min-width: 0; }
.outcome .opane .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.outcome .opane.after .lbl { color: var(--accent); font-weight: 700; }
.outcome .opane .figure, .outcome .opane .shots { margin-top: 4px; }
.outcome .opane .shots { grid-template-columns: 1fr; }
.outcome .shots img { max-height: 420px; }
.figure .ftitle { font-size: 13px; font-weight: 600; }
.figure .svgwrap { overflow-x: auto; }
.figure svg { max-width: 100%; height: auto; display: block; margin: 8px auto; color: var(--ink); }
figcaption { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.shots figure { margin: 0; }
.shots img { width: 100%; height: auto; max-height: 360px; object-fit: contain; display: block; border: 1px solid var(--line);
  border-radius: 8px; cursor: zoom-in; background: var(--surface-2); }
.shots img:hover { border-color: var(--accent); }
dialog.zoom { max-width: 96vw; max-height: 96vh; padding: 0; border: 0; border-radius: 10px; background: var(--surface); }
dialog.zoom::backdrop { background: rgb(0 0 0 / .75); }
dialog.zoom img { display: block; max-width: 96vw; max-height: calc(96vh - 40px); cursor: zoom-out; }
dialog.zoom p { margin: 0; padding: 8px 12px; font-size: 13px; color: var(--ink-2); }
.options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.opt { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px;
  font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.opt:hover { border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .rec { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt[aria-pressed="true"] .rec { color: inherit; opacity: .8; }
.note { width: 100%; margin-top: 10px; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;

  // The ids an item relies on (its "needs") that are not chosen: undecided, a "no work" option, or a rejected item.
  function missingNeeds(it, items, state) {

  function buildPrompt(data, items, state) {

    function custom(it) { var o = it.options || []; return !(o.length === 2 && o[0].value === 'approve' && o[1].value === 'decline'); }

    if (revived.length) out.push('', '## ' + t.revived, t.revivedRule, revived.join('\n'));
    if (open.length) out.push('', '## ' + t.open, t.openRule, open.join('\n'));

  // The prompt for doing one option of one card, alone: what a review thread's <details> holds.
  function hasCustomOptions(it) { var o = it.options || []; return !(o.length === 2 && o[0].value === 'approve' && o[1].value === 'decline'); }

  // Markdown for one card: what a review thread (or the review body) shows.
  function itemBlock(data, items, state, it, t, inDiff, platform) {
    var s = state[it.id] || {};
    var out = ['**' + it.id + ' — ' + it.title + '**'];
    function bullets(v) {
      if (v == null || v === '') return '';
      return Array.isArray(v) ? v.map(function (b) { return '- ' + b; }).join('\n') : String(v);
    }
    var detail = bullets(it.detail);
    if (detail) out.push(detail);
    var why = bullets(it.why);
    if (why) out.push(why.indexOf('\n') < 0 && !/^\s*[-•]\s/.test(why) ? '*' + why + '*' : why);
    if (it.kind === 'tension' && it.sides) out.push(it.sides.map(function (sd) { return '- **' + sd.who + '**: ' + sd.position; }).join('\n'));
    var opt = (it.options || []).filter(function (o) { return o.value === s.choice; })[0];
    var note = s.note && s.note.trim() ? s.note.trim().replace(/\s+/g, ' ') : '';
    if (opt) out.push(t.suggestion + opt.label + (note ? ' — ' + note : ''));
    else if (note) out.push(t.noteOnly + note);
    if (it.needs && it.needs.length) out.push(t.reliesThread.replace('%s', it.needs.join(', ')));
    var sug = suggestionOf(it);
    var emitted = false;
    if (sug && it.at && inDiff) {

      for (var k = 0; k < sug.s.lines; k++) if (!inDiff(it.at.path, it.at.line + k)) emitted = false;
      if (emitted) {
        var stext = sug.s.text.replace(/\n$/, '');
        var open = platform === 'gitlab' ? '```suggestion:-0+' + (sug.s.lines - 1) : '```suggestion';
        out.push((sug.opt ? t.suggestionFor.replace('%s', sug.opt.label) : t.suggestionLabel) + '\n\n' + open + '\n' + (stext === '' ? '' : stext + '\n') + '```');
      }
    }
    var custom = hasCustomOptions(it);
    (it.options || []).forEach(function (o) {
      if (o.negative || !(o.brief || it.brief)) return;
      var body = buildItemPrompt(data, items, it, o);
      var fence = '````';
      (body.match(/`+/g) || []).forEach(function (run) { while (run.length >= fence.length) fence += '`'; });
      out.push('<details><summary>' + (custom ? t.promptFor + o.label : t.prompt) + '</summary>\n\n' + fence + 'text\n' + body + '\n' + fence + '\n\n</details>');

  // The review: { body, comments: [{ id, path, line, body }] }. inDiff(path, line) says whether a comment can sit on that line.
  function buildReview(data, items, state, inDiff, platform) {
    var t = PROMPT_TEXT[data.lang] || PROMPT_TEXT.en;
    var comments = [], unanchored = [], minor = [], rejected = [];
    items.forEach(function (it) {
      if (it.kind === 'rejected') { rejected.push('- ' + it.id + ' — ' + it.title + (it.why ? ' (' + (Array.isArray(it.why) ? it.why.join('; ') : it.why) + ')' : '')); return; }
      var chosen = (it.options || []).filter(function (o) { return o.value === (state[it.id] || {}).choice; })[0];
      if (data.kind === 'review' && chosen && chosen.negative) return; // the reviewer dropped it: not posted
      // Every card whose line is in the diff gets its own thread, minor or not; the body keeps the rest.
      var anchored = it.at && inDiff(it.at.path, it.at.line);
      var ib = itemBlock(data, items, state, it, t, anchored ? inDiff : null, platform);
      var block = ib.text;
      if (anchored) {
        var c = { id: it.id, path: it.at.path, line: it.at.line, body: block };
        if (ib.suggested && suggestionOf(it).s.lines > 1) { c.startLine = it.at.line; c.line = it.at.line + suggestionOf(it).s.lines - 1; }
        comments.push(c); return;
      }
      if (it.at) { var nl = block.indexOf('\n'); block = block.slice(0, nl < 0 ? block.length : nl) + '\n`' + it.at.path + ':' + it.at.line + '`' + (nl < 0 ? '' : block.slice(nl)); }
      (it.minor ? minor : unanchored).push(block);
    });
    var body = ['## ' + data.title];
    var sum = (data.summary || []).map(function (b) {
      if (typeof b === 'string') return '- ' + b;
      if (b.points && b.points.length) return '- **' + b.label + '**:\n' + b.points.map(function (p) { return '  - ' + p; }).join('\n');
      return '- **' + b.label + '**: ' + b.text;
    });
    if (sum.length) body.push(sum.join('\n'));
    body.push(t.howTo);
    [[t.notAnchored, unanchored, '\n\n'], [t.minor, minor, '\n\n'], [t.rejected, rejected, '\n']].forEach(function (sec) {
      if (sec[1].length) body.push('### ' + sec[0] + '\n' + sec[1].join(sec[2]));
    });
    return { body: body.join('\n\n'), comments: comments };
  }
  // Accept recommended: every card without a choice takes its default, else its recommended option. Returns how many it set.
  // render.js --accept-recommended runs this and decisionsBlock with node:vm, so its block is the one this page would send.
  function acceptRecommended(items, state) {
    var n = 0;
    items.forEach(function (it) {
      if ((state[it.id] || {}).choice) return;
      var rec = it.default || (it.options.filter(function (o) { return o.recommended; })[0] || {}).value;
      if (rec) { state[it.id] = state[it.id] || {}; state[it.id].choice = rec; n++; }
    });

  }
  function decisionsBlock(data, items, state, mode) {
    var lines = ['CEO DECISIONS — ' + data.title];
    if (data.source) lines.push('record: ' + data.source);
    if (mode) lines.push('mode: ' + mode);
    items.forEach(function (it) {
      var s = state[it.id] || {};
      var line = it.id + ' = ' + (s.choice || 'UNDECIDED');
      // An option that breaks a constraint lifts it: the record says so (bridge.md).

/*PROMPT-END*/
/*SHARE-START*/
  // The Share dialog: what the reader gets, and where it goes. render.js --channels says which of link/review are available.
  var SHARE_WHAT = [
    { id: 'file', label: 'The page as a file' },
    { id: 'link', label: 'A claude.ai link', why: 'Needs Claude\'s Artifact tool in this session.' },
    { id: 'review', label: 'A review on the merge/pull request (you submit it)', suffix: true, why: 'Not detected: needs the repo host\'s CLI (glab, gh…) logged in and an open merge/pull request for this branch.' }
  ];
  var SHARE_WHERE = [
    { id: 'self', label: 'I\'ll send it myself' },
    { id: 'review', label: 'Comment on the merge/pull request', placeholder: '@username',
      why: 'Not detected: needs the repo host\'s CLI (glab, gh…) logged in and an open merge/pull request for this branch.' },
    { id: 'mail', label: 'Email: Claude prepares the draft', placeholder: 'name@example.com' },
    { id: 'slack', label: 'Slack: Claude prepares the message', placeholder: '@person or #channel' }
  ];
  function shareChoices(given) {
    given = given || {};
    function one(c) {
      var v = c.why ? given[c.id] : true, obj = !!v && typeof v === 'object';
      return { id: c.id, label: obj && v.label ? (c.suffix ? c.label + ' — ' + v.label : v.label) : c.label, placeholder: c.placeholder || '',

  }
  // The block Share posts: the decisions block, retitled, with the answers after the title.
  function shareBlock(decisions, as, via, to) {
    var lines = decisions.split('\n'), head = ['as: ' + as, 'via: ' + via];
    to = String(to || '').replace(/\s+/g, ' ').trim();

/*SHARE-END*/
  function output() { return decisionsBlock(data, items, state); }
  // Reset returns to the page's starting choices (the sharer's, on a share page). No confirm(): an Artifact's sandbox blocks it.
  document.getElementById('reset').addEventListener('click', function () {
    state = JSON.parse(JSON.stringify(data.preset || {}));

    document.getElementById('toast').textContent = 'Decisions reset.';
  });

  });

    var text = shareMode ? buildPrompt(data, items, state) : output();
    var out = document.getElementById('out'), toast = document.getElementById('toast');
    var where = shareMode ? 'your coding agent, on your checkout of the branch' : 'Claude';
    function fallback() { out.style.display = 'block'; out.value = text; out.focus(); out.select(); toast.textContent = 'Select all and copy, then paste into ' + where; }

  // Share shows on a review gate only; it opens a two-question picker (what the reader gets, where it goes), then posts the block as CEO SHARE with as:/via:/to: lines: Claude builds the share page, pre-filled with it, and delivers it. Opened as a file, or in share mode, only Copy exists.
  if (!shareMode && /^https?:$/.test(location.protocol)) {

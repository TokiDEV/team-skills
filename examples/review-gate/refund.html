<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Gate</title>
<style>
/* The CEO gate: a calm decision console. Three panes and one cursor: the list of every card with its rails,
   the card being decided, and its evidence by lens. Dark only. */
:root {
  color-scheme: dark;
  --ground: #161514; --panel: #201e1c; --raised: #2a2825; --cur: #34312d; --edge: #2f2c29; --line: #77716a; --foot: #24221f;
  --rail: #6c665f; --rail-lit: #e6e1d9;
  --ink: #eeeae4; --ink-2: #c6c0b7; --ink-3: #a8a198;
  --amber: #e8b65c; --amber-bg: #3a2f1c; --green: #93d18c; --green-bg: #1f2b1d; --red: #f09080; --red-bg: #33201c;
  --biz: #d9a8e8; --biz-bg: #2e2433; --tech: #72cfc0; --tech-bg: #1a2d2a;
  --pro: #9db6ff; --pro-bg: #1b2440; --con: #e8935a; --con-bg: #36220f;
  --add-bg: #1f2b1d; --del-bg: #33201c;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Noto Sans", "Adwaita Sans", Cantarell, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Noto Sans Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
::selection { background: #4b4438; color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: #4a4641 transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #4a4641; border: 3px solid var(--panel); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--line); }
::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a, .link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; }
a:hover, .link:hover { text-decoration-color: var(--ink); }
/* A bare URL breaks anywhere rather than spill into the next column */
a.xlink { overflow-wrap: anywhere; }
code { font: 0.88em/1 var(--mono); color: var(--ink); background: var(--raised); padding: .15em .4em; border-radius: 5px; border: 1px solid var(--edge); }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; font: 600 11.5px/1 var(--mono); color: var(--ink-2);
  background: var(--ground); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; vertical-align: 1px; }
svg.ic { width: 16px; height: 16px; flex: none; display: block; }
.licon { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.l-business { color: var(--biz); }
.l-tech { color: var(--tech); }
.muted { color: var(--ink-3); }

/* Frame: top bar, (tabs on a phone), the three panes, the key legend */
.layout { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top" "tabs" "panes" "foot"; overflow: hidden; }
#head { grid-area: top; } .tabs { grid-area: tabs; } .panes { grid-area: panes; } .foot { grid-area: foot; }

/* Top bar */
.top { display: flex; align-items: center; gap: 20px; padding: 14px 20px 12px; min-width: 0; }
.gt { min-width: 0; flex: 1; }
.gt h1 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 650; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 0 14px; }
.meta code { font-size: 12px; }
.meta .preset { color: var(--ink-2); }
.progress { display: grid; gap: 5px; width: 200px; flex: none; }
.progress .txt { font-size: 14px; color: var(--ink-2); }
.progress .txt b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.progress .track { height: 6px; border-radius: 6px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--edge); overflow: hidden; }
.progress .fill { height: 100%; width: 100%; background: var(--green); border-radius: 6px; transform: scaleX(0); transform-origin: left;
  transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
.actions { display: flex; gap: 8px; flex: none; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 38px; padding: 6px 12px 6px 14px; font-size: 14.5px; font-weight: 550;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; white-space: nowrap; transition: background-color .2s ease-out; }
.btn:hover { background: var(--raised); }
.btn:disabled { color: var(--ink-3); background: none; border-color: var(--edge); cursor: default; }
.btn:disabled kbd { color: var(--ink-3); border-color: var(--edge); }
.btn.primary { background: #3a3631; border-color: var(--ink-3); }
.btn.primary:hover { background: #45403a; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding: 6px 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--panel); }
.side-open { flex: none; }

/* Three panes. #app and the current card are transparent to the grid: the card's two halves land in the centre and evidence columns. */
.panes { display: grid; grid-template-columns: 400px minmax(0, 1fr) 460px; grid-template-rows: minmax(0, 1fr); grid-template-areas: "list card ev";
  gap: 14px; padding: 14px 20px 0; min-height: 0; }
#side { grid-area: list; }
#app { display: contents; }
.card { display: none; }
.card.current { display: contents; }
.c-main { grid-area: card; }
.c-ev { grid-area: ev; }
.card.wide .c-main { grid-area: card-start / card-start / ev-end / ev-end; }
.side-closed .panes { grid-template-columns: minmax(0, 1fr) 460px; grid-template-areas: "card ev"; }
.side-closed #side { display: none; }
/* The list as a slim rail: status marks, rails and ids only; the centre and evidence take the room */
.side-rail .panes { grid-template-columns: 116px minmax(0, 1fr) 500px; }
.side-rail #side .phead { flex-direction: column; align-items: center; padding: 10px 0 6px; gap: 2px; }
.side-rail #side .phead h2, .side-rail #side .phead .c, .side-rail .helpbtn, .side-rail .find, .side-rail .shown-row, .side-rail .rlegend, .side-rail .row .l2,
.side-rail .rti, .side-rail .nmark, .side-rail .sec-hint, .side-rail .empty, .side-rail .sumrow .l1 { display: none; }
.side-rail .list { padding: 0 6px 12px; }
.side-rail .sec { margin: 8px 6px 4px; padding: 0; border-top: 1px solid var(--edge); }
.side-rail .sec > * { display: none; }
.side-rail .row { padding-right: 6px; min-height: 40px; }
.narrow-btn .wide-ic, .side-rail .narrow-btn .narrow-ic { display: none; }
.side-rail .narrow-btn .wide-ic { display: block; }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: var(--r);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .025) inset, 0 10px 28px -16px rgba(0, 0, 0, .7);
  min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.phead { display: flex; align-items: center; gap: 12px; padding: 14px 12px 8px 18px; flex: none; }
.phead h2 { margin: 0; font-size: 16px; font-weight: 650; }
.phead .c { font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--ink-3); flex: none; }
.icon-btn:hover { color: var(--ink); background: var(--raised); }

/* List pane: search, a compact filter menu, then every card by section with its rails */
.find { position: relative; display: flex; gap: 8px; padding: 0 14px 10px; flex: none; }
.find input[type=search] { flex: 1; min-width: 0; height: 36px; font: inherit; font-size: 14px; padding: 0 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--ground); color: var(--ink); caret-color: var(--ink); }
.find input[type=search]::placeholder { color: var(--ink-3); }
.find input[type=search]:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.fbtn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 10px; border-radius: 10px; border: 1px solid var(--line);
  font-size: 14px; font-weight: 550; color: var(--ink-2); background: var(--panel); flex: none; }
.fbtn:hover, .fbtn[aria-expanded="true"] { color: var(--ink); background: var(--raised); }
.fbtn .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 650; display: inline-grid; place-items: center;
  color: var(--ground); background: var(--ink-2); font-variant-numeric: tabular-nums; }
.fmenu { position: absolute; z-index: 5; top: 44px; left: 14px; right: 14px; padding: 14px 16px 16px; display: grid; gap: 14px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 12px; }
.fgroup .fl { font-size: 13px; font-weight: 650; color: var(--ink-2); margin-bottom: 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2);
  background: var(--panel); border: 1px solid var(--edge); }
.pill:hover { color: var(--ink); border-color: var(--line); }
.pill[aria-pressed="true"] { color: var(--ink); background: var(--cur); border-color: var(--ink-3); font-weight: 600; }
.fmenu select { width: 100%; height: 34px; font: inherit; font-size: 14px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.shown-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 18px 8px; font-size: 13px; color: var(--ink-3); flex: none; }
.link { font-size: 13px; }
.empty { padding: 28px 18px; color: var(--ink-3); font-size: 14.5px; }
.list { padding: 0 8px 12px; }
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 16px 10px 6px; }
.list > .sec:first-child, .list > .row:first-child + .sec { padding-top: 6px; }
.gname { font-size: 13.5px; font-weight: 650; color: var(--ink-2); text-align: left; border-radius: 6px; }
.gname:hover { color: var(--ink); }
.gname[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.sec .count { font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
.sec-hint { padding: 0 10px 6px; margin-top: -4px; font-size: 13px; color: var(--ink-3); }
.row { --rowbg: var(--panel); position: relative; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 0; width: 100%; padding: 3px 10px 3px var(--pl, 36px); text-align: left;
  border-radius: 10px; background: var(--rowbg); transition: background-color .25s cubic-bezier(.16, 1, .3, 1); }
.row:hover { --rowbg: var(--raised); }
.row.cur { --rowbg: var(--cur); box-shadow: inset 0 0 0 1px var(--line); }
.row.flash { --rowbg: #3f3a33; }
.row .l1 { display: flex; align-items: baseline; gap: 9px; min-width: 0; max-width: 100%; line-height: 22px; }
.rid { font: 600 12.5px var(--mono); color: var(--ink-3); flex: none; min-width: 2.6em; }
.rti { font-size: 14.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rti code { font-size: .82em; }
.row.cur .rti { font-weight: 600; }
.row.cur .rid, .row.kin .rid { color: var(--ink); }
.nmark { flex: none; color: var(--ink-3); align-self: center; }
.nmark svg { width: 14px; height: 14px; }
/* Line 2 of every row: status, then relation and marks, left-aligned under the title (past the id column) */
.row .l2 { display: flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; flex: 1 0 100%; padding-left: calc(2.6 * 12.5px + 9px); font-size: 13px; color: var(--ink-2); line-height: 20px; }
.stw { font-weight: 550; }
.stw.yes { color: var(--green); }
.stw.todo { color: var(--ink-2); }
.stw.no, .stw.preset, .stw.moot { color: var(--ink-3); }
.relw { color: var(--ink-3); }
.relw b { font: 600 12px var(--mono); color: var(--ink-2); }
.sevw { font-weight: 550; color: var(--ink-3); }
.sevw.blocker { color: var(--red); }
.gapw { color: var(--red); font-weight: 550; }
.gapw:empty { display: none; }
.lm { display: inline-flex; gap: 5px; }
.lp { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 6px; border-radius: 20px; font-size: 12px; font-weight: 550; }
.lp .licon { width: 12px; height: 12px; }
.lp.l-business { background: var(--biz-bg); }
.lp.l-tech { background: var(--tech-bg); }
.sumrow .l2 { flex: 1 1 auto; }
.row.moot .rti { color: var(--ink-3); }
/* A chosen card whose base is still undecided: a red ring on its row */
.chip.gap { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 60%, transparent); }
.rails { position: absolute; inset: 0; pointer-events: none; }
.rv { position: absolute; width: 0; border-left: 2px solid var(--rail); margin-left: -1px; }
.rh { position: absolute; height: 0; border-top: 2px solid var(--rail); margin-top: -1px; }
.rv.after { border-left-style: dashed; }
.rh.after { border-top-style: dashed; }
.rv.lit, .rh.lit { border-color: var(--rail-lit); }
.filtering .rv, .filtering .rh { display: none; }
/* A row's mark, and the rails that meet it, sit --ny down the row: the middle of its first line's lowercase, measured with .nyprobe */
#sideScroll { --ny: 15px; }
.nyprobe { display: inline-block; width: 0; height: 0; vertical-align: middle; }
.node { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
.node svg { width: 16px; height: 16px; display: block; }
/* The rails key lives in the Keys dialog, and behind the ? beside the list title */
.rlegend { display: grid; gap: 8px; font-size: 14.5px; color: var(--ink-2); margin-top: 14px; }
.rlegend div { display: flex; align-items: center; gap: 12px; }
.rlegend i { width: 26px; border-top: 2px solid var(--rail-lit); flex: none; }
.rlegend i.after { border-top-style: dashed; }
.rlegend b { font-weight: 600; color: var(--ink); }
.helpbtn { margin-left: -6px; }
/* A list that overflows fades at its foot, so a clipped row never looks broken */
.sidebody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.sidebody::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px; pointer-events: none; opacity: 0; transition: opacity .2s ease-out;
  background: linear-gradient(to bottom, transparent, var(--panel)); }
.sidebody.more::after { opacity: 1; }

/* Centre pane: the card being decided, its choice pinned at the bottom */
.c-scroll { padding: 26px 30px 26px; }
.ch { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.cloc { flex-basis: 100%; margin-top: -2px; font: 13.5px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }
.cid { font: 600 14px var(--mono); color: var(--ink-2); background: var(--raised); border: 1px solid var(--edge); padding: 2px 8px; border-radius: 7px;
  flex: none; position: relative; top: -3px; }
.ctitle { margin: 0; font-size: 27px; line-height: 1.25; font-weight: 650; letter-spacing: -0.012em; text-wrap: balance; max-width: 36ch; }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 13px; color: var(--ink-2); background: var(--raised); }
.tag.blocker { color: var(--red); background: var(--red-bg); font-weight: 600; }
.tag.warn { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tag.lens { border-radius: 20px; font-weight: 550; }
.tag.lens.l-business { background: var(--biz-bg); }
.tag.lens.l-tech { background: var(--tech-bg); }
.lens-chips { display: contents; }
.rels { margin: 18px 0 0; display: grid; gap: 8px; }
.rely { display: grid; gap: 8px; }
.rely:empty { display: none; }
.relx { --rowbg: var(--raised); display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--raised); font-size: 14.5px; }
.relx .ri { flex: none; width: 30px; height: 22px; display: block; }
.relx .rt { flex: 1; min-width: 0; }
.relx .rs { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink); }
.relx .rs svg { width: 16px; height: 16px; display: block; }
.relx.ok .rs { color: var(--green); }
.relx.neg .rs { color: var(--ink-3); }
.relx.neg .rt { color: var(--ink-2); }
.rel-gap { display: flex; gap: 10px; align-items: baseline; margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--red-bg); color: var(--ink); font-size: 14.5px; }
.rel-gap::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--red); position: relative; top: 1px; }
.rel-gap:empty { display: none; }
.blk { margin: 26px 0 0; }
.blk > h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; color: var(--ink-2); }
.lead { font-size: 18px; line-height: 1.5; margin: 0; max-width: 62ch; }
.prose { max-width: 68ch; }
.prose p { margin: 0; }
.prose p + p { margin-top: 8px; }
.prose ul { margin: 4px 0 0; padding-left: 1.2em; }
.prose li + li { margin-top: 5px; }
.prose li::marker, .sumcol li::marker { color: var(--ink-3); }
.prose strong, .lead strong { font-weight: 650; }
.answer { font-size: 22px; font-weight: 600; margin: 0; }
.found { margin: 6px 0 0; font-size: 14px; }
.args { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 8px; }
.argcol { padding: 2px 26px 4px; min-width: 0; }
.argcol:first-child { padding-left: 0; }
.argcol:last-child { padding-right: 0; border-left: 1px solid var(--edge); }
.argcol h4 { margin: 0 0 10px; font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.argcol h4 .n { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.sg { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; }
/* For/Against stay blue and copper, never the green/red of a code diff */
.pro .sg { background: var(--pro-bg); color: var(--pro); }
.con .sg { background: var(--con-bg); color: var(--con); }
.ten .sg { background: var(--raised); color: var(--ink-2); }
.argcol .pos { margin: 0 0 12px; font-size: 15px; }
/* Three sides or more stack, one under the other: two columns would leave the third alone on a second row */
.args.stack { grid-template-columns: minmax(0, 1fr); }
.args.stack .argcol { padding: 2px 0 4px; border-left: 0; }
.args.stack .argcol + .argcol { border-top: 1px solid var(--edge); padding-top: 16px; margin-top: 6px; }
.arg { margin: 0 0 12px; }
.arg .who { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.arg p { margin: 2px 0 0; font-size: 15px; line-height: 1.5; }
.none { font-size: 14.5px; color: var(--ink-3); margin: 0 0 12px; }
.rectag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--amber); background: var(--amber-bg); white-space: nowrap; }
/* The lens filters both panes and says what it hides */
.card[data-lens="business"] [data-lens="tech"], .card[data-lens="tech"] [data-lens="business"] { display: none; }
.lens-none, .lens-off { display: none; }
.card[data-lens="business"] .lens-none.business, .card[data-lens="tech"] .lens-none.tech { display: block; }
.card[data-lens="business"] .lens-off.tech, .card[data-lens="tech"] .lens-off.business { display: flex; }
.lens-none { font-size: 14.5px; color: var(--ink-3); margin: 10px 0 0; }
.argcol .lens-none { margin: 0 0 12px; }
.lens-off { gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--ink-2); }

.c-decide { border-top: 1px solid var(--edge); padding: 16px 30px 18px; background: var(--foot); flex: none; }
.dh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.dh h3 { margin: 0; font-size: 15px; font-weight: 650; }
.dh .hint { font-size: 13px; color: var(--ink-3); }
.options { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.opt { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 14px 6px 8px; font-size: 15px; font-weight: 550; color: var(--ink); text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 11px; transition: background-color .2s ease-out, border-color .2s ease-out; }
.opt:hover { background: var(--raised); }
.opt kbd { min-width: 24px; height: 24px; font-size: 12.5px; }
.opt.is-rec { border-color: var(--amber); }
.opt .lift { font-size: 12.5px; font-weight: 600; color: var(--red); }
.opt .ck { display: none; color: var(--green); }
.opt .yc { display: none; font-size: 12.5px; font-weight: 600; color: var(--green); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-bg); box-shadow: 0 0 0 1px var(--green) inset; }
.opt[aria-pressed="true"] .ck { display: block; }
.opt[aria-pressed="true"] .yc { display: inline; }
.opt[aria-pressed="true"] kbd { border-color: var(--green); color: var(--green); }
.opt:disabled { color: var(--ink-3); border-style: dashed; border-color: var(--line); cursor: default; background: none; box-shadow: none; }
.opt:disabled .rectag { color: var(--ink-3); background: var(--raised); }
.mootmsg { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--ink-2); margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: var(--raised); }
.notewrap { display: flex; align-items: flex-start; gap: 12px; }
.notewrap label { flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); padding-top: 8px; }
.note { flex: 1; min-width: 0; font: 14.5px/1.45 var(--sans); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 11px; min-height: 38px; height: 38px; resize: vertical; caret-color: var(--ink); }
.note:focus { height: 76px; outline: 2px solid var(--ink); outline-offset: 1px; }
.note::placeholder { color: var(--ink-3); }

/* Right pane: evidence by lens. Arguments live in the centre only. */
.lswitch { display: flex; gap: 4px; padding: 4px; margin: 14px 16px 4px; background: var(--ground); border: 1px solid var(--edge); border-radius: 12px; flex: none; }
.lswitch button { flex: 1 1 auto; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 4px 8px;
  border-radius: 9px; font-size: 14px; font-weight: 550; color: var(--ink-2); }
.lswitch button:hover { color: var(--ink); background: var(--panel); }
.lswitch button[aria-pressed="true"] { color: var(--ink); background: var(--cur); box-shadow: inset 0 0 0 1px var(--line); }
.lswitch button.both { flex: 0 0 auto; padding: 4px 16px; }
.lswitch .n { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.ev-scroll { padding: 4px 18px 20px; }
.eh { margin: 16px 0 6px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.ebox { background: var(--ground); border: 1px solid var(--edge); border-radius: 11px; }
.klist { list-style: none; margin: 0; padding: 0; }
.kst { padding: 10px 14px; display: grid; gap: 3px; }
.kst + .kst { border-top: 1px solid var(--edge); }
.kt { font-size: 14.5px; line-height: 1.45; }
.klens { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; margin-right: 8px; white-space: nowrap; vertical-align: 1px; }
.kid { font: 600 12.5px var(--mono); color: var(--ink-2); margin-right: 6px; }
.ksrc { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; }
.kstat { color: var(--ink); font-weight: 600; }
.ks { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.ks svg { width: 14px; height: 14px; }
.kst.lifted .ks { color: var(--red); font-weight: 600; }
.kst.lifted .kt { color: var(--ink-2); }
.tbox { overflow-x: auto; }
.btable { width: 100%; border-collapse: collapse; }
.btable th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 9px 12px 7px; border-bottom: 1px solid var(--edge); }
.btable th .klens { margin: 0; }
.btable td { padding: 9px 12px; vertical-align: top; font-size: 14px; line-height: 1.45; }
.btable tbody tr + tr td { border-top: 1px solid var(--edge); }
.btable td.o { font-weight: 550; width: 38%; min-width: 11em; }
.btable td.o kbd { margin-right: 7px; }
.otags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.btable tr.chosen td.o { color: var(--green); }
.lift { display: inline-flex; align-items: center; height: 20px; font-size: 12px; font-weight: 600; color: var(--red); background: var(--red-bg); padding: 0 7px; border-radius: 6px; white-space: nowrap; }
.opt .lift { background: none; padding: 0; height: auto; }
.mine { display: inline-flex; align-items: center; height: 20px; font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-bg); padding: 0 7px; border-radius: 6px; }
.metric { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; align-items: baseline; }
.metric + .metric { border-top: 1px solid var(--edge); }
.metric .ml { font-size: 14.5px; display: inline-flex; align-items: baseline; gap: 7px; }
.metric .ml .licon { align-self: center; }
.metric .mv { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.metric .md { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }
.metric .md.better { color: var(--green); }
.metric .md.worse { color: var(--red); }
.code { overflow: hidden; }
.code + .code { margin-top: 8px; }
.code .cl { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--edge); }
.code .cl span { font-weight: 400; color: var(--ink-3); }
.code pre { margin: 0; padding: 8px 0; font: 13px/1.6 var(--mono); overflow-x: auto; }
.code pre div { padding: 0 12px; white-space: pre; min-width: max-content; }
.code pre .del { background: var(--del-bg); color: #f3c2b8; }
.code pre .add { background: var(--add-bg); color: #cdeec8; }
.code pre .ctx { color: var(--ink-2); }
/* Which option's own evidence the pane shows: the current choice, until another is picked */
.optpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; }
.optpick .pl { flex-basis: 100%; font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.optpick button { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 3px 10px; font-size: 13px; color: var(--ink-2);
  background: none; border: 1px solid var(--edge); border-radius: 8px; text-align: left; }
.optpick button:hover { color: var(--ink); background: var(--panel); }
.optpick button[aria-pressed="true"] { color: var(--ink); background: var(--cur); border-color: var(--ink-3); font-weight: 600; }
.optpick button.mine { border-color: var(--green); }
.nocode { margin: 8px 0 0; font-size: 14px; }
.loc { font: 13.5px var(--mono); color: var(--ink); padding: 9px 12px; overflow-wrap: anywhere; }
.loc .fref code, .cloc .fref code { font: inherit; background: none; border: 0; padding: 0; }
.fref .forge { width: 1em; height: 1em; margin-left: 5px; vertical-align: -.15em; color: var(--ink-3); }
.fref .ext { text-decoration: none; }
a.fref:hover .forge, .fref .ext:hover .forge { color: var(--ink); }
.ev-empty { font-size: 14.5px; color: var(--ink-3); margin: 16px 0 0; }
.ev-empty.lens-none { display: none; }
.card[data-lens="business"] .ev-empty.lens-none.business, .card[data-lens="tech"] .ev-empty.lens-none.tech { display: block; }
.accfoot { border-top: 1px solid var(--edge); padding: 14px 20px 16px; background: var(--foot); font-size: 15px; flex: none; }
.accfoot b { display: block; font-size: 14px; font-weight: 650; color: var(--ink-2); margin-bottom: 2px; }

/* Figures: SVG at reading size, screenshots in a grid that opens full size */
.figure { margin: 12px 0 0; }
.figure .ftitle { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.figure .svgwrap { overflow-x: auto; color: var(--ink-2); }
/* The figure palette (figures.md), mapped onto the page's: unfilled marks take the text colour, not SVG's default black;
   box fills and label masks are the ground the figure sits on; the focus is told by brightness alone, a step above
   ink-2 text, sublabels a step below. */
.figure svg { max-width: 100%; height: auto; display: block; margin: 8px auto; fill: currentColor;
  --surface: var(--panel); --surface-2: var(--raised); --accent: var(--ink); --ink-2: var(--ink-3); }
.oview .figure svg { --surface: var(--ground); --surface-2: var(--panel); }
figcaption, .ocap { font-size: 13.5px; color: var(--ink-3); margin-top: 4px; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
.shots figure { margin: 0; }
.shots img { width: 100%; height: auto; max-height: 360px; object-fit: contain; display: block; border: 1px solid var(--edge); border-radius: 10px; cursor: zoom-in; background: var(--raised); }
.shots img:hover { border-color: var(--line); }

/* The summary item: the whole summary, the outcome and the gate's figures, across both right-hand columns */
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px 36px; margin-top: 22px; }
.sumcol h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; color: var(--ink-2); }
.sumcol p, .sumcol ul { margin: 0; font-size: 15px; line-height: 1.55; max-width: 62ch; }
.sumcol ul { padding-left: 1.1em; }
.sumcol li + li { margin-top: 4px; }
.oview { background: var(--ground); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
.ohead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ohead b { font-size: 15px; font-weight: 650; }
.ohead .oif { font-size: 13px; color: var(--ink-3); }
.opanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 16px; margin-top: 8px; }
.opane { min-width: 0; }
.opane .olbl { font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.opane .figure, .opane .shots { margin-top: 4px; }
.opane .shots { grid-template-columns: 1fr; }
.opane .shots img { max-height: 420px; }

/* Bottom: the keys that work right now, and the last message */
.foot { display: flex; align-items: center; gap: 24px; padding: 10px 20px 12px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-3); min-width: 0; flex: 1; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend span.ctx { color: var(--ink-2); }
.legend kbd { height: 19px; min-width: 19px; font-size: 11px; }
.toast { font-size: 13.5px; color: var(--ink-2); flex: none; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast:empty { display: none; }
#out { display: none; position: fixed; right: 20px; bottom: 54px; z-index: 8; width: min(560px, calc(100vw - 32px)); height: 220px; resize: none;
  font: 12.5px/1.55 var(--mono); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--ink);
  }
.touchnav, .tabs { display: none; }

/* Dialogs: keys, share, zoom */
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 0; }
dialog::backdrop { background: rgba(10, 9, 8, .72); }
dialog.help { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; padding: 22px 24px 18px; }
dialog.help h3 { margin: 0 0 14px; font-size: 19px; font-weight: 650; }
dialog.help table { border-collapse: collapse; font-size: 14.5px; width: 100%; }
dialog.help td { padding: 5px 16px 5px 0; vertical-align: top; }
dialog.help td:first-child { white-space: nowrap; width: 1%; }
dialog.help h3.sub3 { margin: 18px 0 0; font-size: 14px; color: var(--ink-2); }
dialog.help th { text-align: left; font-size: 14px; font-weight: 650; color: var(--ink-2); padding: 14px 0 4px; }
dialog.help tr:first-child th { padding-top: 0; }
dialog.help .buttons { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 16px; }
dialog.help .buttons .muted { flex: 1; font-size: 14px; }
.share-picker { width: min(540px, calc(100vw - 32px)); }
.share-q { border: 0; padding: 0; margin: 0 0 14px; }
.share-q legend { font-size: 14px; font-weight: 650; color: var(--ink-2); margin-bottom: 4px; padding: 0; }
.chan { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
.chan input { accent-color: var(--green); margin-top: 4px; }
.chan b { font-weight: 550; }
.chan.off { color: var(--ink-3); cursor: default; }
.chan small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.chan-to { display: flex; gap: 10px; align-items: center; margin: 4px 0 12px; color: var(--ink-2); font-size: 14px; }
.chan-to input { flex: 1; font: inherit; font-size: 14px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); }
dialog.zoom { max-width: 96vw; max-height: 96vh; overflow: hidden; }
dialog.zoom img { display: block; max-width: 96vw; max-height: calc(96vh - 40px); cursor: zoom-out; }
dialog.zoom p { margin: 0; padding: 8px 14px; font-size: 13.5px; color: var(--ink-2); }
dialog.zoom p:empty { display: none; }

/* Narrower desktops: slimmer side panes, no keycaps on the top-bar buttons */
@media (max-width: 1400px) {
  .panes { grid-template-columns: 340px minmax(0, 1fr) 400px; }
  .side-closed .panes { grid-template-columns: minmax(0, 1fr) 440px; }
  .side-rail .panes { grid-template-columns: 116px minmax(0, 1fr) 440px; }
  .actions .btn kbd { display: none; }
}
@media (max-width: 1180px) {
  .top { flex-wrap: wrap; gap: 10px 16px; }
  .gt { flex-basis: 100%; }
  .progress { flex: 1; width: auto; min-width: 160px; }
}
/* Tablets: the list beside the card, the evidence under it */
@media (max-width: 1100px) and (min-width: 761px) {
  .panes { grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); grid-template-areas: "list card" "list ev"; }
  .side-closed .panes { grid-template-columns: minmax(0, 1fr); grid-template-areas: "card" "ev"; }
  .side-rail .panes { grid-template-columns: 116px minmax(0, 1fr); }
  .c-scroll { padding: 20px 22px; }
  .c-decide { padding: 14px 22px 16px; }
  .args { grid-template-columns: 1fr; }
  .argcol, .argcol:first-child, .argcol:last-child { padding: 2px 0 4px; border-left: 0; }
  .argcol + .argcol { border-top: 1px solid var(--edge); padding-top: 16px; margin-top: 6px; }
}
/* Phones: one pane at a time, picked by tab; the choice stays pinned under the card */
@media (max-width: 760px) {
  /* The top bar opens up: the title stays on top, progress and actions become a bar pinned at the bottom */
  .layout { grid-template-rows: auto auto auto minmax(0, 1fr) auto auto auto; grid-template-areas: "top" "sum" "tabs" "panes" "foot" "prog" "acts"; }
  #head { display: contents; }
  .gt { grid-area: top; padding: 10px 16px 6px; }
  .progress { grid-area: prog; width: auto; padding: 10px 16px 0; background: var(--panel); border-top: 1px solid var(--edge); }
  .actions { grid-area: acts; padding: 8px 16px 12px; background: var(--panel); }
  .gt h1 { white-space: normal; font-size: 16.5px; }
  .side-open, #keys { display: none !important; }
  .actions { flex-wrap: wrap; gap: 6px; }
  .actions .btn { flex: 1 1 auto; min-height: 36px; padding: 5px 10px; font-size: 13.5px; }
  .meta .srcm { display: none; }
  .tabs { display: flex; margin: 8px 16px 0; padding: 3px; gap: 4px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
  .tabs button { flex: 1; min-height: 34px; border-radius: 9px; color: var(--ink-2); font-weight: 550; }
  .tabs button[aria-selected="true"] { color: var(--ink); background: var(--cur); }
  .narrow-btn { display: none !important; }
  .panes, .side-closed .panes, .side-rail .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "main"; padding: 10px 16px 0; }
  #side, .side-closed #side, .c-main, .c-ev, .card.wide .c-main { grid-area: main; display: none; }
  .layout[data-tab="list"] #side, .layout[data-tab="card"] .card.current .c-main, .layout[data-tab="ev"] .card.current .c-ev,
  .layout[data-tab="ev"] .card.current.wide .c-main { display: flex !important; }
  .c-scroll { padding: 18px 18px 16px; }
  .ctitle { font-size: 22px; }
  .lead { font-size: 16.5px; }
  .args { grid-template-columns: 1fr; }
  .argcol, .argcol:first-child, .argcol:last-child { padding: 2px 0 4px; border-left: 0; }
  .argcol + .argcol { border-top: 1px solid var(--edge); padding-top: 16px; margin-top: 6px; }
  /* The arguments come first: the card scrolls as one and "Your choice" follows them instead of covering them */
  .c-main { overflow-y: auto; }
  .c-main .c-scroll { overflow: visible; flex: none; }
  .c-decide { padding: 12px 16px 32px; flex: none; }
  /* A soft fade at the foot of the scrolling card says there is more below */
  .c-main::after { content: ''; display: block; position: sticky; bottom: 0; flex: none; height: 30px; margin-top: -30px; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--foot)); }
  .dh { display: none; }
  .opt { flex: 1 1 auto; min-height: 44px; padding-right: 10px; }
  .options { gap: 8px; margin-bottom: 10px; }
  .relx { flex-wrap: wrap; gap: 6px 12px; }
  .relx .rs { flex-basis: 100%; padding-left: 42px; }
  .meta code { font-size: 11px; }
  .notewrap label { display: none; }
  .row { padding-top: 9px; padding-bottom: 9px; }
  .foot { padding: 10px 16px 10px; flex-direction: column; align-items: stretch; gap: 8px; }
  .legend { display: none; }
  .touchnav { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .touchnav button { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 14px; }
  .toast { max-width: none; white-space: normal; }
}
@media (max-width: 640px) {
  /* The trade-off table stacks: one block per option, each cost labelled by its lens */
  .btable, .btable tbody, .btable tr, .btable td { display: block; }
  .btable thead { display: none; }
  .btable tbody tr + tr { border-top: 1px solid var(--edge); }
  .btable tbody tr + tr td { border-top: 0; }
  .btable td { padding: 4px 12px; }
  .btable td.o { padding-top: 10px; }
  .btable td:last-child { padding-bottom: 10px; }
  .btable td[data-l]::before { content: attr(data-l); display: block; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
  .figure svg { min-width: 560px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
@media print {
  .layout { display: block; height: auto; overflow: visible; }
  #side, .foot, .tabs, .actions, .side-open, .lswitch, .c-decide .notewrap { display: none !important; }
  .panes { display: block; padding: 0; }
  .card, .card.current { display: block; break-inside: avoid; margin-bottom: 16px; }
  .panel { display: block; box-shadow: none; overflow: visible; margin-bottom: 8px; }
  .scroll { overflow: visible; }
}
</style>
</head>
<body>
<div class="layout" data-tab="card">
  <header id="head" class="top">
    <div class="gt" id="gt"></div>
    <div class="progress" aria-live="polite"><div class="txt" id="ptxt"></div><div class="track"><div class="fill" id="pfill"></div></div></div>
    <div class="actions">
      <button class="btn ghost" id="reset" type="button">Reset</button>
      <button class="btn" id="recAll" type="button">Accept recommended <kbd>A</kbd></button>
      <button class="btn wide" id="share" type="button" hidden>Share</button>
      <button class="btn primary" id="copy" type="button"><span id="copyLabel">Copy decisions</span> <kbd>C</kbd></button>
      <button class="btn primary" id="send" type="button" hidden>Send to Claude <kbd>S</kbd></button>
      <button class="btn ghost" id="keys" type="button" aria-label="Keyboard keys"><kbd>?</kbd> Keys</button>
    </div>
  </header>
  <div class="tabs" id="tabs" role="tablist" aria-label="Panes"></div>
  <div class="panes">
    <aside id="side" class="panel" aria-label="Cards">
      <div class="phead" id="sideHead"></div>
      <div class="find" id="find"></div>
      <div class="sidebody" id="sidebody"><div class="side-scroll scroll" id="sideScroll"></div></div>
    </aside>
    <main id="app"></main>
  </div>
  <footer class="foot">
    <div class="legend" id="legend" aria-label="Keys that work now"></div>
    <div class="touchnav" id="touchnav"></div>
    <div class="toast" id="toast" role="status"></div>
    <textarea id="out" readonly aria-label="Decisions to paste back"></textarea>

  // A card with "on" is moot once its root is answered and the choice excludes it: a negative option, an option outside "on.when",
  // or a root that is itself moot. Returns null, or { id, value, label } of the root's choice.
  function mootBy(it, items, state) {
    if (!it.on) return null;
    var root = items.filter(function (x) { return x.id === it.on.id; })[0];
    if (!root) return null;
    var up = mootBy(root, items, state);
    if (up) return up;
    var c = (state[root.id] || {}).choice;
    var opt = (root.options || []).filter(function (o) { return o.value === c; })[0];
    if (!opt) return null;
    var w = it.on.when == null ? null : [].concat(it.on.when);
    if (opt.negative || (w && w.indexOf(c) < 0)) return { id: root.id, value: c, label: opt.label };
    return null;
  }
  function missingAfter(it, items, state) {
    return relyLines(it, items, state).map(function (r) { return r.id; }).filter(function (id) {
      var dep = items.filter(function (x) { return x.id === id; })[0];
      if (dep && mootBy(dep, items, state)) return false;
      if (!dep || dep.kind === 'rejected') return true;
      var c = (state[id] || {}).choice;
      return !(dep.options || []).some(function (o) { return o.value === c && !o.negative; });
    });
  }
  function buildPrompt(data, items, state) {
    var t = PROMPT_TEXT[data.lang] || PROMPT_TEXT.en;
    var todo = [], left = [], revived = [], open = [], notes = [];
    function line(it, extra) { return '- ' + it.id + ' — ' + it.title + (extra ? ' (' + extra + ')' : ''); }
    function custom(it) { var o = it.options || []; return !(o.length === 2 && o[0].value === 'approve' && o[1].value === 'decline'); }
    items.forEach(function (it) {
      var s = state[it.id] || {};
      var opt = (it.options || []).filter(function (o) { return o.value === s.choice; })[0];
      if (mootBy(it, items, state)) return;
      if (s.note && s.note.trim()) notes.push('- ' + it.id + ': ' + s.note.trim().replace(/\s+/g, ' '));
      if (it.kind === 'settled') { if (s.choice === 'reopen') open.push(line(it, it.answer)); return; }
      if (it.kind === 'rejected') {
        if (s.choice === 'revive') revived.push(line(it, Array.isArray(it.why) ? it.why.join('; ') : it.why));
        return;
      }
      if (!opt) { open.push(line(it)); return; }
      if (opt.negative) { left.push(line(it, opt.label)); return; }
      var block = ['### ' + it.id + ' — ' + it.title];
      if (custom(it)) block.push(t.choice + opt.label);
      var missing = missingAfter(it, items, state);
      if (missing.length) block.push((missing.length > 1 ? t.afterN : t.after1).replace('%s', missing.join(', ')));
      block.push('', opt.brief || it.brief || '');
      todo.push(block.join('\n'));
    });
    var out = [data.preamble || '', '', '## ' + t.todo, '', todo.length ? todo.join('\n\n') : t.none];
    if (left.length) out.push('', '## ' + t.left, left.join('\n'));
    if (revived.length) out.push('', '## ' + t.revived, t.revivedRule, revived.join('\n'));
    if (open.length) out.push('', '## ' + t.open, t.openRule, open.join('\n'));
    if (notes.length) out.push('', '## ' + t.notes, notes.join('\n'));
    out.push('', '## ' + t.end, t.endText);
    return out.join('\n');
  }
  // The prompt for doing one option of one card, alone: what a review thread's <details> holds.
  function hasCustomOptions(it) { var o = it.options || []; return !(o.length === 2 && o[0].value === 'approve' && o[1].value === 'decline'); }
  function buildItemPrompt(data, items, it, opt) {
    var t = PROMPT_TEXT[data.lang] || PROMPT_TEXT.en;
    var block = ['### ' + it.id + ' — ' + it.title];
    if (hasCustomOptions(it)) block.push(t.choice + opt.label);
    if (it.after && it.after.length) block.push((it.after.length > 1 ? t.afterCheckN : t.afterCheck1).replace('%s', it.after.join(', ')));
    block.push('', opt.brief || it.brief || '');
    return [data.preamble || '', '', '## ' + t.todo, '', block.join('\n'), '', '## ' + t.end, t.endText].join('\n');
  }
  // Markdown for one card: what a review thread (or the review body) shows.
  function itemBlock(data, items, state, it, t, inDiff, platform) {
    var s = state[it.id] || {};
    var out = ['**' + it.id + ' — ' + it.title + '**'];
    function bullets(v) {
      if (v == null || v === '') return '';
      return Array.isArray(v) ? v.map(function (b) { return '- ' + b; }).join('\n') : String(v);
    }
    var detail = bullets(it.detail);
    if (detail) out.push(detail);
    var why = bullets(it.why);
    if (why) out.push(why.indexOf('\n') < 0 && !/^\s*[-•]\s/.test(why) ? '*' + why + '*' : why);
    if (it.kind === 'tension' && it.sides) out.push(it.sides.map(function (sd) { return '- **' + sd.who + '**: ' + sd.position; }).join('\n'));
    var opt = (it.options || []).filter(function (o) { return o.value === s.choice; })[0];
    var note = s.note && s.note.trim() ? s.note.trim().replace(/\s+/g, ' ') : '';
    if (opt) out.push(t.suggestion + opt.label + (note ? ' — ' + note : ''));
    else if (note) out.push(t.noteOnly + note);
    if (it.after && it.after.length) out.push(t.afterThread.replace('%s', it.after.join(', ')));
    var sug = suggestionOf(it);
    var emitted = false;
    if (sug && it.at && inDiff) {
      emitted = true;
      for (var k = 0; k < sug.s.lines; k++) if (!inDiff(it.at.path, it.at.line + k)) emitted = false;
      if (emitted) {
        var stext = sug.s.text.replace(/\n$/, '');
        var open = platform === 'gitlab' ? '```suggestion:-0+' + (sug.s.lines - 1) : '```suggestion';
        out.push((sug.opt ? t.suggestionFor.replace('%s', sug.opt.label) : t.suggestionLabel) + '\n\n' + open + '\n' + (stext === '' ? '' : stext + '\n') + '```');
      }
    }
    var custom = hasCustomOptions(it);
    (it.options || []).forEach(function (o) {
      if (o.negative || !(o.brief || it.brief)) return;
      var body = buildItemPrompt(data, items, it, o);
      var fence = '````';
      (body.match(/`+/g) || []).forEach(function (run) { while (run.length >= fence.length) fence += '`'; });
      out.push('<details><summary>' + (custom ? t.promptFor + o.label : t.prompt) + '</summary>\n\n' + fence + 'text\n' + body + '\n' + fence + '\n\n</details>');
    });
    return { text: out.join('\n\n'), suggested: emitted };
  }
  function suggestionOf(it) {
    if (it.suggestion) return { s: it.suggestion };
    var o = (it.options || []).filter(function (x) { return x.suggestion; })[0];
    return o ? { s: o.suggestion, opt: o } : null;
  }
  // The review: { body, comments: [{ id, path, line, body }] }. inDiff(path, line) says whether a comment can sit on that line.
  function buildReview(data, items, state, inDiff, platform) {
    var t = PROMPT_TEXT[data.lang] || PROMPT_TEXT.en;
    var comments = [], unanchored = [], minor = [], rejected = [], settled = [], reopened = [], nMajor = 0, nMinor = 0;
    items.forEach(function (it) {
      if (it.kind === 'settled') {
        var st = state[it.id] || {};
        if (st.choice === 'reopen') reopened.push('- ' + it.id + ' — ' + it.title + (st.note && st.note.trim() ? ' — ' + st.note.trim().replace(/\s+/g, ' ') : ''));
        else settled.push('- ' + it.id + ' — ' + it.title + ': ' + it.answer + ' (' + it.who + ')');
        return;
      }
      if (it.kind === 'rejected') { rejected.push('- ' + it.id + ' — ' + it.title + (it.why ? ' (' + (Array.isArray(it.why) ? it.why.join('; ') : it.why) + ')' : '')); return; }
      var chosen = (it.options || []).filter(function (o) { return o.value === (state[it.id] || {}).choice; })[0];
      if (data.kind === 'review' && chosen && chosen.negative) return; // the reviewer dropped it: not posted
      if (mootBy(it, items, state)) return;
      if (it.minor) nMinor++; else nMajor++;
      // Every card whose line is in the diff gets its own thread, minor or not; the body keeps the rest.
      var anchored = it.at && inDiff(it.at.path, it.at.line);
      var ib = itemBlock(data, items, state, it, t, anchored ? inDiff : null, platform);
      var block = ib.text;
      if (anchored) {
        var c = { id: it.id, path: it.at.path, line: it.at.line, body: block };
        if (ib.suggested && suggestionOf(it).s.lines > 1) { c.startLine = it.at.line; c.line = it.at.line + suggestionOf(it).s.lines - 1; }
        comments.push(c); return;
      }
      if (it.at) { var nl = block.indexOf('\n'); block = block.slice(0, nl < 0 ? block.length : nl) + '\n`' + it.at.path + ':' + it.at.line + '`' + (nl < 0 ? '' : block.slice(nl)); }
      (it.minor ? minor : unanchored).push(block);
    });
    var body = ['## ' + data.title];
    var sum = (data.summary || []).map(function (b) {
      if (typeof b === 'string') return '- ' + b;
      if (b.points && b.points.length) return '- **' + b.label + '**:\n' + b.points.map(function (p) { return '  - ' + p; }).join('\n');
      return '- **' + b.label + '**: ' + b.text;
    });
    if (sum.length) body.push(sum.join('\n'));
    body.push(t.howTo);
    body.push(t.counts.replace('%m', nMajor).replace('%k', nMinor));
    [[t.notAnchored, unanchored, '\n\n'], [t.minor, minor, '\n\n'], [t.reopened, reopened, '\n'], [t.settled, settled, '\n'], [t.rejected, rejected, '\n']].forEach(function (sec) {
      if (sec[1].length) body.push('### ' + sec[0] + '\n' + sec[1].join(sec[2]));
    });
    return { body: body.join('\n\n'), comments: comments };
  }
  // Accept recommended: every card without a choice takes its default, else its recommended option. Returns how many it set.
  // render.js --accept-recommended runs this and decisionsBlock with node:vm, so its block is the one this page would send.
  function acceptRecommended(items, state) {
    var n = 0;
    items.forEach(function (it) {
      if ((state[it.id] || {}).choice || mootBy(it, items, state)) return;
      var rec = it.default || (it.options.filter(function (o) { return o.recommended; })[0] || {}).value;
      if (rec) { state[it.id] = state[it.id] || {}; state[it.id].choice = rec; n++; }
    });
    return n;
  }
  function decisionsBlock(data, items, state, mode) {
    var lines = ['CEO DECISIONS — ' + data.title];
    if (data.source) lines.push('record: ' + data.source);
    if (mode) lines.push('mode: ' + mode);
    items.forEach(function (it) {
      var s = state[it.id] || {};
      var moot = mootBy(it, items, state);
      if (moot) { lines.push(it.id + ' = moot (' + moot.id + ' = ' + moot.value + ')'); return; }
      var line = it.id + ' = ' + (s.choice || 'UNDECIDED');
      // An option that breaks a constraint lifts it: the record says so (bridge.md).
      var opt = (it.options || []).filter(function (o) { return o.value === s.choice; })[0];
      if (opt && opt.violates && opt.violates.length) line += ' (lifts ' + opt.violates.join(', ') + ')';
      if (s.note && s.note.trim()) line += ' | note: ' + s.note.trim().replace(/\s+/g, ' ');
      lines.push(line);
    });
    return lines.join('\n');
  }
/*PROMPT-END*/
/*SHARE-START*/
  // The Share dialog: what the reader gets, and where it goes. render.js --channels says which of link/review are available.
  var SHARE_WHAT = [
    { id: 'file', label: 'The page as a file' },
    { id: 'link', label: 'A claude.ai link', why: 'Needs Claude\'s Artifact tool in this session.' },
    { id: 'review', label: 'A review on the merge/pull request (you submit it)', suffix: true, why: 'Not detected: needs the repo host\'s CLI (glab, gh…) logged in and an open merge/pull request for this branch.' }
  ];
  var SHARE_WHERE = [
    { id: 'self', label: 'I\'ll send it myself' },
    { id: 'review', label: 'Comment on the merge/pull request', placeholder: '@username',
      why: 'Not detected: needs the repo host\'s CLI (glab, gh…) logged in and an open merge/pull request for this branch.' },
    { id: 'mail', label: 'Email: Claude prepares the draft', placeholder: 'name@example.com' },
    { id: 'slack', label: 'Slack: Claude prepares the message', placeholder: '@person or #channel' }
  ];
  function shareChoices(given) {
    given = given || {};
    function one(c) {
      var v = c.why ? given[c.id] : true, obj = !!v && typeof v === 'object';
      return { id: c.id, label: obj && v.label ? (c.suffix ? c.label + ' — ' + v.label : v.label) : c.label, placeholder: c.placeholder || '',
        available: v === true || obj, reason: typeof v === 'string' ? v : (c.why || '') };
    }
    return { what: SHARE_WHAT.map(one), where: SHARE_WHERE.map(one) };
  }
  // The block Share posts: the decisions block, retitled, with the answers after the title.
  function shareBlock(decisions, as, via, to) {
    var lines = decisions.split('\n'), head = ['as: ' + as, 'via: ' + via];
    to = String(to || '').replace(/\s+/g, ' ').trim();
    if (to && via !== 'self') head.push('to: ' + to);
    return [lines[0].replace(/^CEO DECISIONS/, 'CEO SHARE')].concat(head, lines.slice(1)).join('\n');
  }
/*SHARE-END*/
  function output() { return decisionsBlock(data, items, state); }
  // Reset returns to the page's starting choices (the sharer's, on a share page). No confirm(): an Artifact's sandbox blocks it.
  document.getElementById('reset').addEventListener('click', function () {
    state = JSON.parse(JSON.stringify(data.preset || {}));
    items.forEach(function (it) { cards[it.id].note.value = (state[it.id] && state[it.id].note) || ''; });
    applyDefaults(); save(); render(); applyFilters(true);
    document.getElementById('out').style.display = 'none';
    document.getElementById('toast').textContent = 'Decisions reset.';
  });
  document.getElementById('recAll').addEventListener('click', function () {
    var n = acceptRecommended(items, state);
    save(); render(); applyFilters(true);
    document.getElementById('toast').textContent = n > 0 ? n + ' card' + (n === 1 ? '' : 's') + ' set to the recommended option.' : 'No undecided card has a recommended option.';
  });
  if (shareMode) {
    document.getElementById('copyLabel').textContent = 'Copy prompt';
    document.getElementById('out').setAttribute('aria-label', 'Prompt to paste into your coding agent');
  }
  // The copy fallback box closes once the reader leaves it.
  document.getElementById('out').addEventListener('blur', function () { this.style.display = 'none'; });
  document.getElementById('copy').addEventListener('click', function () {
    var text = shareMode ? buildPrompt(data, items, state) : output();
    var out = document.getElementById('out'), toast = document.getElementById('toast');
    var where = shareMode ? 'your coding agent, on your checkout of the branch' : 'Claude';
    function fallback() { out.style.display = 'block'; out.value = text; out.focus(); out.select(); toast.textContent = 'Select all and copy, then paste into ' + where; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast.textContent = 'Copied. Paste it into ' + where + '.'; }, fallback);
    } else { fallback(); }
  });
  // Served by `render.js --serve`: Send posts the block to the local server, which hands it to Claude and exits;
  // Share shows on a review gate only; it opens a two-question picker (what the reader gets, where it goes), then posts the block as CEO SHARE with as:/via:/to: lines: Claude builds the share page, pre-filled with it, and delivers it. Opened as a file, or in share mode, only Copy exists.
  if (!shareMode && /^https?:$/.test(location.protocol)) {
    var send = document.getElementById('send'), copy = document.getElementById('copy'), share = document.getElementById('share');
    send.hidden = false;
    share.hidden = data.kind !== 'review';
    copy.classList.remove('primary');
    copy.classList.add('wide');
    var post = function (body, sent, failed, btn) {
      var toast = document.getElementById('toast');
      btn.disabled = true;
      fetch('decisions', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        toast.textContent = sent;
        // Browsers let a script close a tab that has a single page in its history, as one opened by render.js has.
        // Elsewhere close() does nothing and the toast stays.
        window.close();
      }).catch(function () {
        btn.disabled = false;
        toast.textContent = failed;
      });
    };
    send.addEventListener('click', function () {
      var undecided = items.filter(function (it) { return !choiceOf(it.id); }).length;
      if (undecided && !confirm(undecided + ' item(s) undecided. Send anyway? Claude will ask about them.')) return;
      post(output(), 'Sent. Claude has your decisions; you can close this tab.', 'Could not reach Claude. Use Copy decisions and paste instead.', send);
    });
    share.addEventListener('click', function () {
      picker = el('dialog', 'help share-picker');
      picker.appendChild(el('h3', null, 'Share this page'));
      var choices = shareChoices(data.channels), sel = { as: 'file', via: 'self' }, whereById = {};
      var toRow = el('label', 'chan-to'), toInput = el('input'), shareBtn = el('button', 'btn primary', 'Share'), cancel = el('button', 'btn', 'Cancel');
      toInput.type = 'text';
      toRow.appendChild(document.createTextNode('To (optional)'));
      toRow.appendChild(toInput);
      shareBtn.type = 'button';
      cancel.type = 'button';
      var radios = { as: {}, via: {} };
      var sync = function () {
        // A review is posted on the merge/pull request: that route is the only one.
        if (sel.as === 'review') sel.via = 'review';
        Object.keys(radios.via).forEach(function (id) {
          var r = radios.via[id];
          r.disabled = sel.as === 'review' ? id !== 'review' : !r.dataset.available;
          r.checked = sel.via === id;
        });
        toRow.hidden = sel.via === 'self';
        toInput.placeholder = (whereById[sel.via] && whereById[sel.via].placeholder) || '';
      };
      var question = function (legend, name, list) {
        var fs = el('fieldset', 'share-q');
        fs.appendChild(el('legend', null, legend));
        list.forEach(function (c) {
          var row = el('label', 'chan' + (c.available ? '' : ' off')), radio = el('input'), text = el('span');
          radio.type = 'radio';
          radio.name = name;
          radio.value = c.id;
          radio.disabled = !c.available;
          if (c.available) radio.dataset.available = '1';
          radio.checked = sel[name] === c.id;
          radios[name][c.id] = radio;
          radio.addEventListener('change', function () { sel[name] = c.id; sync(); });
          text.appendChild(el('b', null, c.label));
          if (!c.available) text.appendChild(el('small', null, c.reason));
          row.appendChild(radio);
          row.appendChild(text);
          fs.appendChild(row);
        });
        picker.appendChild(fs);
      };
      choices.where.forEach(function (c) { whereById[c.id] = c; });
      question('What the reader gets', 'as', choices.what);
      question('Where it goes', 'via', choices.where);
      picker.appendChild(toRow);
      sync();
      var buttons = el('div', 'buttons');
      buttons.appendChild(cancel);
      buttons.appendChild(shareBtn);
      picker.appendChild(buttons);
      cancel.addEventListener('click', function () { picker.close(); });
      picker.addEventListener('click', function (e) { if (e.target === picker) picker.close(); });
      picker.addEventListener('close', function () { if (picker.parentNode) picker.parentNode.removeChild(picker); });
      shareBtn.addEventListener('click', function () {
        var toValue = toInput.value;
        picker.close();
        post(shareBlock(output(), sel.as, sel.via, toValue), 'Sent. Claude is sharing the page; you can close this tab.', 'Could not reach Claude. Ask it in chat to share this gate.', share);
      });
      document.body.appendChild(picker);
      picker.showModal();
    });
  }
  render();
  applyFilters();
  // Land on the card named in the address (#d-ID), else the summary, else the first card still to decide.
  var start = '';
  try { start = decodeURIComponent(location.hash.replace(/^#d-/, '')); } catch (e) { start = ''; }
  setCurrent(cards[start] ? start : hasSummary ? SUM : firstOpen());
  setTab('card');
  fade();
})();
</script>
